services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    mem_limit: 2g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  coeiroink:
    profiles:
      - coeiroink
    build:
      context: ./engines/coeiroink
      dockerfile: Dockerfile
      args:
        COEIROINK_ENGINE_REF: ${COEIROINK_ENGINE_REF:-c-1.6.0+v-0.12.3}
        COEIROINK_SPEAKER_SOURCE: ${COEIROINK_SPEAKER_SOURCE:-https://coeiroink.com/download}
        COEIROINK_SPEAKER_PREFIXES: ${COEIROINK_SPEAKER_PREFIXES:-}
    mem_limit: 4g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  sharevox:
    profiles:
      - sharevox
    build:
      context: ./engines/sharevox
      dockerfile: Dockerfile
      args:
        SHAREVOX_ENGINE_REF: ${SHAREVOX_ENGINE_REF:-0.2.1}
        SHAREVOX_ENGINE_VERSION: ${SHAREVOX_ENGINE_VERSION:-0.2.1}
        SHAREVOX_RESOURCE_VERSION: ${SHAREVOX_RESOURCE_VERSION:-0.2.1}
        SHAREVOX_CORE_VERSION: ${SHAREVOX_CORE_VERSION:-0.2.1}
        SHAREVOX_MODEL_VERSION: ${SHAREVOX_MODEL_VERSION:-0.2.1}
    mem_limit: 4g
    environment:
      SV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voicevox_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  discord-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VOICEVOX_URL: ${VOICEVOX_URL:-http://voicevox:50021}
      COEIROINK_URL: ${COEIROINK_URL:-http://coeiroink:50031}
      SHAREVOX_URL: ${SHAREVOX_URL:-http://sharevox:50025}
      DEFAULT_SPEAKER_ID: "46"
      DATABASE_URL: postgresql://bot:bot@postgres:5432/voicevox_bot
      INTERNAL_TTS_API_ENABLED: ${INTERNAL_TTS_API_ENABLED:-false}
      INTERNAL_TTS_API_HOST: ${INTERNAL_TTS_API_HOST:-0.0.0.0}
      INTERNAL_TTS_API_PORT: ${INTERNAL_TTS_API_PORT:-8080}
      INTERNAL_TTS_API_TOKEN: ${INTERNAL_TTS_API_TOKEN:-}
      INTERNAL_TTS_API_MAX_TEXT_LENGTH: ${INTERNAL_TTS_API_MAX_TEXT_LENGTH:-120}
    depends_on:
      - voicevox
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
