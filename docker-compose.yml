services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    mem_limit: 2g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
      VV_PRESET_FILE: /home/user/.local/share/voicevox-engine/presets.yaml
    volumes:
      - voicevox_user_data:/home/user/.local/share/voicevox-engine
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  coeiroink:
    profiles:
      - coeiroink
    build:
      context: ./engines/coeiroink
      dockerfile: Dockerfile
      args:
        COEIROINK_ENGINE_REF: ${COEIROINK_ENGINE_REF:-c-1.6.0+v-0.12.3}
        COEIROINK_SPEAKER_SOURCE: ${COEIROINK_SPEAKER_SOURCE:-https://coeiroink.com/download}
        COEIROINK_SPEAKER_PREFIXES: ${COEIROINK_SPEAKER_PREFIXES:-}
    mem_limit: 4g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
      COEIROINK_SPEAKER_SOURCE: ${COEIROINK_SPEAKER_SOURCE:-https://coeiroink.com/download}
      COEIROINK_SPEAKER_PREFIXES: ${COEIROINK_SPEAKER_PREFIXES:-}
      COEIROINK_FORCE_INSTALL: ${COEIROINK_FORCE_INSTALL:-0}
    volumes:
      - coeiroink_speaker_info:/opt/coeiroink_engine/speaker_info
      - coeiroink_openjtalk_dic:/opt/pyenv/versions/3.8.10/lib/python3.8/site-packages/pyopenjtalk/open_jtalk_dic_utf_8-1.11
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  sharevox:
    profiles:
      - sharevox
    build:
      context: ./engines/sharevox
      dockerfile: Dockerfile
      args:
        SHAREVOX_ENGINE_REF: ${SHAREVOX_ENGINE_REF:-0.2.1}
        SHAREVOX_ENGINE_VERSION: ${SHAREVOX_ENGINE_VERSION:-0.2.1}
        SHAREVOX_RESOURCE_VERSION: ${SHAREVOX_RESOURCE_VERSION:-0.2.1}
        SHAREVOX_CORE_VERSION: ${SHAREVOX_CORE_VERSION:-0.2.1}
        SHAREVOX_MODEL_VERSION: ${SHAREVOX_MODEL_VERSION:-0.2.1}
    mem_limit: 4g
    environment:
      SV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
      SHAREVOX_ENGINE_VERSION: ${SHAREVOX_ENGINE_VERSION:-0.2.1}
      SHAREVOX_RESOURCE_VERSION: ${SHAREVOX_RESOURCE_VERSION:-0.2.1}
      SHAREVOX_CORE_VERSION: ${SHAREVOX_CORE_VERSION:-0.2.1}
      SHAREVOX_MODEL_VERSION: ${SHAREVOX_MODEL_VERSION:-0.2.1}
      ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION:-1.12.1}
      SHAREVOX_FORCE_INSTALL: ${SHAREVOX_FORCE_INSTALL:-0}
    volumes:
      - sharevox_data:/opt/sharevox_data
      - sharevox_openjtalk_dic:/usr/local/lib/python3.8/site-packages/pyopenjtalk/open_jtalk_dic_utf_8-1.11
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voicevox_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  discord-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VOICEVOX_URL: ${VOICEVOX_URL:-http://voicevox:50021}
      COEIROINK_URL: ${COEIROINK_URL:-http://coeiroink:50031}
      SHAREVOX_URL: ${SHAREVOX_URL:-http://sharevox:50025}
      DEFAULT_SPEAKER_ID: "46"
      DATABASE_URL: postgresql://bot:bot@postgres:5432/voicevox_bot
    depends_on:
      - voicevox
      - postgres
    restart: unless-stopped

volumes:
  voicevox_user_data:
  coeiroink_speaker_info:
  coeiroink_openjtalk_dic:
  sharevox_data:
  sharevox_openjtalk_dic:
  pgdata:
