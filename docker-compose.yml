services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  # coeiroink:
  #   build:
  #     context: ./engines/coeiroink
  #     dockerfile: Dockerfile
  #   restart: unless-stopped

  # sharevox:
  #   build:
  #     context: ./engines/sharevox
  #     dockerfile: Dockerfile
  #   restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voicevox_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  discord-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VOICEVOX_URL: http://voicevox:50021
      # COEIROINK_URL: http://coeiroink:50031
      # SHAREVOX_URL: http://sharevox:50025
      DEFAULT_SPEAKER_ID: "3"
      DATABASE_URL: postgresql://bot:bot@postgres:5432/voicevox_bot
    depends_on:
      - voicevox
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
