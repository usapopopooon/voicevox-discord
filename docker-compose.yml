services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    mem_limit: 2g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

  coeiroink:
    image: ${COEIROINK_IMAGE:-voicevox-discord-coeiroink:latest}
    build:
      context: ./engines/coeiroink
      dockerfile: Dockerfile
      args:
        COEIROINK_ENGINE_REF: ${COEIROINK_ENGINE_REF:-c-1.6.0+v-0.12.3}
        COEIROINK_SPEAKER_SOURCE: ${COEIROINK_SPEAKER_SOURCE:-https://coeiroink.com/download}
        COEIROINK_SPEAKER_PREFIXES: ${COEIROINK_SPEAKER_PREFIXES:-}
    mem_limit: 4g
    environment:
      VV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
      COEIROINK_SPEAKER_SOURCE: ${COEIROINK_SPEAKER_SOURCE:-https://coeiroink.com/download}
      COEIROINK_SPEAKER_PREFIXES: ${COEIROINK_SPEAKER_PREFIXES:-}
      COEIROINK_FORCE_INSTALL: ${COEIROINK_FORCE_INSTALL:-0}
    volumes:
      - coeiroink_speaker_cache:/opt/coeiroink_cache
      - coeiroink_openjtalk_dic:/opt/pyenv/versions/3.8.10/lib/python3.8/site-packages/pyopenjtalk/open_jtalk_dic_utf_8-1.11
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  sharevox:
    image: ${SHAREVOX_IMAGE:-voicevox-discord-sharevox:latest}
    build:
      context: ./engines/sharevox
      dockerfile: Dockerfile
      args:
        SHAREVOX_ENGINE_REF: ${SHAREVOX_ENGINE_REF:-0.2.1}
        SHAREVOX_ENGINE_VERSION: ${SHAREVOX_ENGINE_VERSION:-0.2.1}
        SHAREVOX_RESOURCE_VERSION: ${SHAREVOX_RESOURCE_VERSION:-0.2.1}
        SHAREVOX_CORE_VERSION: ${SHAREVOX_CORE_VERSION:-0.2.1}
        SHAREVOX_MODEL_VERSION: ${SHAREVOX_MODEL_VERSION:-0.2.1}
    mem_limit: 4g
    environment:
      SV_CPU_NUM_THREADS: "4"
      VV_OUTPUT_LOG_UTF8: "1"
      SHAREVOX_ENGINE_VERSION: ${SHAREVOX_ENGINE_VERSION:-0.2.1}
      SHAREVOX_RESOURCE_VERSION: ${SHAREVOX_RESOURCE_VERSION:-0.2.1}
      SHAREVOX_CORE_VERSION: ${SHAREVOX_CORE_VERSION:-0.2.1}
      SHAREVOX_MODEL_VERSION: ${SHAREVOX_MODEL_VERSION:-0.2.1}
      ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION:-1.12.1}
      SHAREVOX_FORCE_INSTALL: ${SHAREVOX_FORCE_INSTALL:-0}
    volumes:
      - sharevox_asset_cache:/opt/sharevox_cache
      - sharevox_openjtalk_dic:/usr/local/lib/python3.8/site-packages/pyopenjtalk/open_jtalk_dic_utf_8-1.11
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voicevox_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - voicevox-postgres
      join-tts:
        aliases:
          - voicevox-discord-tts
    ports:
      - "${INTERNAL_TTS_BIND_ADDRESS:-127.0.0.1}:${INTERNAL_TTS_PUBLISHED_PORT:-0}:${INTERNAL_TTS_API_PORT:-8080}"
    restart: unless-stopped

  voicevox-discord:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_TOKENS: ${DISCORD_TOKENS:-}
      VOICEVOX_URL: http://voicevox:50021
      COEIROINK_URL: http://coeiroink:50031
      SHAREVOX_URL: http://sharevox:50025
      DEFAULT_SPEAKER_ID: ${DEFAULT_SPEAKER_ID:-46}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bot:bot@127.0.0.1:5432/voicevox_bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      TTS_AUDIO_QUERY_TIMEOUT_SECONDS: ${TTS_AUDIO_QUERY_TIMEOUT_SECONDS:-3}
      TTS_SYNTHESIS_TIMEOUT_SECONDS: ${TTS_SYNTHESIS_TIMEOUT_SECONDS:-8}
      TTS_SPEAKERS_TIMEOUT_SECONDS: ${TTS_SPEAKERS_TIMEOUT_SECONDS:-3}
      RECENT_SYNTH_TTL_SECONDS: ${RECENT_SYNTH_TTL_SECONDS:-45}
      DISCORD_MESSAGE_CACHE_SIZE: ${DISCORD_MESSAGE_CACHE_SIZE:-100}
      INTERNAL_TTS_API_ENABLED: ${INTERNAL_TTS_API_ENABLED:-false}
      INTERNAL_TTS_API_HOST: ${INTERNAL_TTS_API_HOST:-0.0.0.0}
      INTERNAL_TTS_API_PORT: ${INTERNAL_TTS_API_PORT:-8080}
      INTERNAL_TTS_API_TOKEN: ${INTERNAL_TTS_API_TOKEN:-}
      INTERNAL_TTS_API_MAX_TEXT_LENGTH: ${INTERNAL_TTS_API_MAX_TEXT_LENGTH:-120}
    network_mode: service:postgres
    depends_on:
      - voicevox
      - coeiroink
      - sharevox
      - postgres
    restart: unless-stopped

volumes:
  coeiroink_speaker_cache:
  coeiroink_openjtalk_dic:
  sharevox_asset_cache:
  sharevox_openjtalk_dic:
  pgdata:

networks:
  join-tts:
    name: ${VOICEVOX_INTERNAL_TTS_NETWORK:-voicevox-discord-tts}
    external: true
