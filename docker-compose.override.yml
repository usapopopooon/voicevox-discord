services:
  voicevox:
    # ローカルでVOICEVOX APIを直接叩けるようにポート公開
    ports:
      - "50021:50021"

  coeiroink:
    # COMPOSE_PROFILES=coeiroink のときだけ起動。API確認用に公開する
    ports:
      - "50031:50031"

  sharevox:
    # COMPOSE_PROFILES=sharevox のときだけ起動。API確認用に公開する
    ports:
      - "50025:50025"

  postgres:
    # ローカルでDBに直接接続できるようにポート公開
    ports:
      - "5432:5432"

  voicevox-discord:
    # 本番Dockerfileではなく開発用を使う
    build:
      context: ./bot
      dockerfile: Dockerfile.dev
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_TOKENS: ${DISCORD_TOKENS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bot:bot@127.0.0.1:5432/voicevox_bot}
    env_file:
      - .env
    volumes:
      # ホストのbot/をコンテナにマウント → ファイル変更がコンテナに即反映
      - ./bot:/app
    # watchmedo が restart をかけるので restart: no にする
    restart: "no"
